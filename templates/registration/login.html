<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Present.ia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-yellow': '#FFCC00',
                        'brand-blue': '#00247D',
                        'brand-blue-accent': '#0033B3',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- contenedor principal centrado -->
    <div class="w-full max-w-md bg-white border border-slate-200/60 shadow-2xl rounded-2xl p-8 relative overflow-hidden">
        
        <!-- decorador de marca superior -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-blue via-brand-yellow to-brand-blue-accent"></div>
        
        <!-- cabecera -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-brand-blue rounded-xl flex items-center justify-center shadow-lg mx-auto mb-4">
                <span class="text-white font-bold text-2xl">P</span>
            </div>
            <h2 class="text-2xl font-bold text-brand-blue tracking-tight">Present.ia</h2>
            <p class="text-sm text-slate-500 mt-1">iniciar sesión para acceder al panel docente</p>
        </div>

        {% if form.errors %}
        <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
            <span class="font-bold">error:</span> usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <!-- formulario de login -->
        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-semibold text-slate-700 mb-1.5">usuario / correo electrónico</label>
                <input type="text" name="username" autofocus required id="id_username" 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue transition-all duration-200 text-slate-800 placeholder-slate-400"
                       placeholder="ingresa tu usuario">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-semibold text-slate-700 mb-1.5">contraseña</label>
                <input type="password" name="password" required id="id_password" 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue transition-all duration-200 text-slate-800 placeholder-slate-400"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 rounded-xl bg-brand-blue hover:bg-brand-blue-accent text-white font-bold shadow-md shadow-brand-blue/15 hover:shadow-lg transition-all duration-200 text-center mt-2">
                entrar al panel
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-400 border-t border-slate-100 pt-6">
            © 2026 cv college · control biométrico de asistencia
        </div>
    </div>

</body>
</html>
